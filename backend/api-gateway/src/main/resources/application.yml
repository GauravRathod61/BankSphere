server:
  port: 8080

spring:
  application:
    name: api-gateway

services:
  customer-service-url: http://localhost:8081
  account-service-url: http://localhost:8082
  transaction-service-url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
