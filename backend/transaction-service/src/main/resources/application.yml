server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

banking:
  account-service-url: http://localhost:8082
  account-service:
    connect-timeout: 2000ms
    read-timeout: 3000ms
  security:
    jwt:
      secret: ${JWT_SECRET}
      service-token-expiration-seconds: 300

resilience4j:
  retry:
    retry-aspect-order: 2
    instances:
      accountService:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - java.net.ConnectException
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      accountService:
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.banking.transaction_service.exception.AccountServiceRejectedException
          - com.banking.transaction_service.exception.AccountServiceSecurityException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

